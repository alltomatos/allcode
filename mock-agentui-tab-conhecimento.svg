<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="primary-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181b26"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Navigation Rail & Sidebar -->
  <rect x="0" y="0" width="60" height="1000" fill="#0d0f17"/>
  <line x1="60" y1="0" x2="60" y2="1000" stroke="#1c2030" stroke-width="1"/>
  <circle cx="30" cy="30" r="14" fill="#ef4444"/>

  <rect x="60" y="0" width="220" height="1000" fill="#0f111a"/>
  <line x1="280" y1="0" x2="280" y2="1000" stroke="#1c2030" stroke-width="1"/>
  <text x="80" y="42" fill="#94a3b8" font-size="12" font-weight="600">MEUS AGENTES</text>

  <!-- Main Container -->
  <rect x="280" y="0" width="1320" height="1000" fill="url(#bg-grad)"/>

  <!-- Top App Header -->
  <g transform="translate(280, 0)">
    <rect x="0" y="0" width="1320" height="64" fill="#0d0f18"/>
    <line x1="0" y1="64" x2="1320" y2="64" stroke="#1e2232" stroke-width="1"/>
    <text x="72" y="38" fill="#ffffff" font-size="17" font-weight="600">Editar Agente · ProH-TI</text>
    <rect x="280" y="22" width="70" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="302" y="36" fill="#6ee7b7" font-size="11" font-weight="600">ONLINE</text>
    <rect x="1204" y="15" width="90" height="34" rx="6" fill="url(#primary-btn)"/>
    <text x="1232" y="37" fill="#ffffff" font-size="13" font-weight="600">Salvar</text>
  </g>

  <!-- Tabs Navigation Header -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="1240" height="48" rx="8" fill="#11131e" stroke="#1f2334" stroke-width="1"/>
    <text x="35" y="30" fill="#94a3b8" font-size="13" font-weight="500">Geral</text>
    <text x="140" y="30" fill="#94a3b8" font-size="13" font-weight="500">Personalidade &amp; IA</text>
    <text x="345" y="30" fill="#94a3b8" font-size="13" font-weight="500">Canais</text>
    <text x="450" y="30" fill="#94a3b8" font-size="13" font-weight="500">Ferramentas</text>

    <!-- Tab 5: Conhecimento (ACTIVE) -->
    <rect x="590" y="6" width="150" height="36" rx="6" fill="#1e2237" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="610" cy="24" r="4" fill="#6366f1"/>
    <text x="625" y="29" fill="#ffffff" font-size="13" font-weight="600">Conhecimento</text>
  </g>

  <!-- Tab Conhecimento Content -->
  <g transform="translate(320, 150)">
    
    <!-- CARD: FONTES DE CONHECIMENTO RAG -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1240" height="480" rx="10" fill="url(#card-grad)" stroke="#22283a" stroke-width="1.5" filter="url(#shadow-card)"/>
      <path d="M 0 10 Q 0 0 10 0 L 1230 0 Q 1240 0 1240 10 L 1240 45 L 0 45 Z" fill="#151824"/>
      <line x1="0" y1="45" x2="1240" y2="45" stroke="#22283a" stroke-width="1"/>
      <text x="25" y="28" fill="#f8fafc" font-size="14" font-weight="600">Fontes de Conhecimento Externas (RAG Context)</text>
      <text x="1040" y="28" fill="#94a3b8" font-size="12">Capacidade: 2 / 10 fontes</text>

      <g transform="translate(25, 65)">
        <text x="0" y="0" fill="#94a3b8" font-size="12">
          Adicione textos de referência ou páginas web (URLs). As informações são injetadas diretamente no contexto de raciocínio do agente.
        </text>

        <!-- Source Item 1: URL Externa -->
        <g transform="translate(0, 20)">
          <rect x="0" y="0" width="1190" height="52" rx="6" fill="#0d0f17" stroke="#252b3e" stroke-width="1"/>
          
          <rect x="12" y="10" width="65" height="32" rx="4" fill="#1e2436"/>
          <text x="28" y="30" fill="#38bdf8" font-size="11" font-weight="600">URL</text>

          <rect x="85" y="10" width="220" height="32" rx="4" fill="#131622" stroke="#262d42"/>
          <text x="97" y="30" fill="#f8fafc" font-size="12">Documentação do Prohospital</text>

          <rect x="315" y="10" width="800" height="32" rx="4" fill="#131622" stroke="#262d42"/>
          <text x="327" y="30" fill="#64748b" font-size="12" font-family="monospace">https://wiki.prohospital.intranet/docs/dhcp-guidelines</text>

          <!-- Remove Action -->
          <circle cx="1150" cy="26" r="12" fill="#1e2233"/>
          <text x="1146" y="30" fill="#94a3b8" font-size="14">×</text>
        </g>

        <!-- Source Item 2: Texto Fixo -->
        <g transform="translate(0, 82)">
          <rect x="0" y="0" width="1190" height="52" rx="6" fill="#0d0f17" stroke="#252b3e" stroke-width="1"/>
          
          <rect x="12" y="10" width="65" height="32" rx="4" fill="#2d1b4e"/>
          <text x="24" y="30" fill="#c084fc" font-size="11" font-weight="600">TEXTO</text>

          <rect x="85" y="10" width="220" height="32" rx="4" fill="#131622" stroke="#262d42"/>
          <text x="97" y="30" fill="#f8fafc" font-size="12">Contatos de Plantão TI</text>

          <rect x="315" y="10" width="800" height="32" rx="4" fill="#131622" stroke="#262d42"/>
          <text x="327" y="30" fill="#64748b" font-size="12">Escala: João (85 99111-2233), Maria (85 98888-4455). Escala Noturna...</text>

          <circle cx="1150" cy="26" r="12" fill="#1e2233"/>
          <text x="1146" y="30" fill="#94a3b8" font-size="14">×</text>
        </g>

        <!-- Botão Adicionar Nova Fonte -->
        <g transform="translate(0, 150)">
          <rect x="0" y="0" width="180" height="36" rx="6" fill="#1c2032" stroke="#374151" stroke-width="1"/>
          <path d="M22 18 H32 M27 13 V23" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
          <text x="40" y="23" fill="#f8fafc" font-size="12" font-weight="600">Adicionar Fonte</text>
        </g>

        <!-- Banner Explicativo -->
        <g transform="translate(0, 220)">
          <rect x="0" y="0" width="1190" height="60" rx="6" fill="#10131e" stroke="#1f2334" stroke-width="1"/>
          <text x="20" y="26" fill="#38bdf8" font-size="12" font-weight="600">Como o agente utiliza as fontes:</text>
          <text x="20" y="46" fill="#64748b" font-size="11.5">
            Ao receber uma pergunta pelo WhatsApp ou Telegram, o conteúdo dessas fontes é carregado na memória do agente antes de responder, garantindo precisão em dados técnicos da empresa.
          </text>
        </g>
      </g>
    </g>

  </g>
</svg>
