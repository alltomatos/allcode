version: '3.8'

networks:
  public-net:
    driver: overlay
    attachable: true
  data-tier:
    external: true

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

secrets:
  allcode_pg_password:
    external: true
  allcode_redis_password:
    external: true

services:
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.postgres.address=:5432"
      - "--entryPoints.redis.address=:6379"
      - "--entryPoints.traefik.address=:8080"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: host
      - target: 5432
        published: 5432
        mode: host
      - target: 6379
        published: 6379
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/allcode-data/traefik:/etc/traefik/dynamic:ro
    networks:
      - public-net
      - data-tier
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: allcode_audit
      POSTGRES_USER: allcode_user
      POSTGRES_PASSWORD_FILE: /run/secrets/allcode_pg_password
    secrets:
      - allcode_pg_password
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c maintenance_work_mem=1GB
      -c work_mem=64MB
      -c max_connections=200
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    volumes:
      - pg_data:/var/lib/postgresql/data
      - /opt/allcode-data/postgres/01-init-audit-schema.sql:/docker-entrypoint-initdb.d/01-init-audit-schema.sql:ro
    networks:
      - data-tier
      - public-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '6.0'
          memory: 14G
        reservations:
          cpus: '1.0'
          memory: 4G
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.pg.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.pg.entrypoints=postgres"
        - "traefik.tcp.services.pg.loadbalancer.server.port=5432"

  redis:
    image: redis:7-alpine
    secrets:
      - allcode_redis_password
    entrypoint:
      - sh
      - -c
      - "exec redis-server --requirepass \"$$(cat /run/secrets/allcode_redis_password)\" --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes"
    volumes:
      - redis_data:/data
    networks:
      - data-tier
      - public-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G
        reservations:
          cpus: '0.2'
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.tcp.routers.redis.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.redis.entrypoints=redis"
        - "traefik.tcp.services.redis.loadbalancer.server.port=6379"
