<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="primary-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181b26"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Navigation Rail -->
  <rect x="0" y="0" width="60" height="1000" fill="#0d0f17"/>
  <line x1="60" y1="0" x2="60" y2="1000" stroke="#1c2030" stroke-width="1"/>
  <circle cx="30" cy="30" r="14" fill="#ef4444"/>
  <path d="M26 22 Q30 18 34 22 Q30 20 26 22" fill="#10b981"/>

  <!-- Left Sidebar (Agents List) -->
  <rect x="60" y="0" width="220" height="1000" fill="#0f111a"/>
  <line x1="280" y1="0" x2="280" y2="1000" stroke="#1c2030" stroke-width="1"/>
  <text x="80" y="42" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">MEUS AGENTES</text>
  <circle cx="255" cy="38" r="11" fill="#1e2333"/>
  <path d="M251 38 H259 M255 34 V42" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <g transform="translate(70, 70)">
    <rect x="0" y="0" width="200" height="36" rx="6" fill="transparent"/>
    <circle cx="16" cy="18" r="4" fill="#64748b"/>
    <text x="32" y="22" fill="#94a3b8" font-size="13">Assistente Geral</text>

    <rect x="0" y="42" width="200" height="36" rx="6" fill="transparent"/>
    <circle cx="16" cy="60" r="4" fill="#64748b"/>
    <text x="32" y="64" fill="#94a3b8" font-size="13">E2E Tailscale Test</text>

    <rect x="0" y="84" width="200" height="36" rx="6" fill="transparent"/>
    <circle cx="16" cy="102" r="4" fill="#64748b"/>
    <text x="32" y="106" fill="#94a3b8" font-size="13">Ronaldo pessoal</text>

    <rect x="0" y="126" width="200" height="36" rx="6" fill="#1e2235" stroke="#3b4261" stroke-width="1"/>
    <circle cx="16" cy="144" r="5" fill="#7c3aed" filter="url(#glow-primary)"/>
    <text x="32" y="148" fill="#f8fafc" font-size="13" font-weight="600">ProH-TI (Ativo)</text>
  </g>

  <!-- Main Container -->
  <rect x="280" y="0" width="1320" height="1000" fill="url(#bg-grad)"/>

  <!-- Top App Header -->
  <g transform="translate(280, 0)">
    <rect x="0" y="0" width="1320" height="64" fill="#0d0f18"/>
    <line x1="0" y1="64" x2="1320" y2="64" stroke="#1e2232" stroke-width="1"/>
    <rect x="24" y="16" width="32" height="32" rx="6" fill="#171a26" stroke="#252a3d"/>
    <path d="M42 32 H34 M37 27 L32 32 L37 37" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="38" fill="#ffffff" font-size="17" font-weight="600">Editar Agente · ProH-TI</text>
    <rect x="280" y="22" width="70" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="292" cy="32" r="3.5" fill="#34d399"/>
    <text x="302" y="36" fill="#6ee7b7" font-size="11" font-weight="600">ONLINE</text>

    <rect x="910" y="15" width="165" height="34" rx="6" fill="#1e2235" stroke="#374151" stroke-width="1"/>
    <path d="M925 32 L933 24 L937 36 L942 28 L947 32" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="955" y="37" fill="#f1f5f9" font-size="12" font-weight="600">Diagnóstico</text>

    <rect x="1087" y="15" width="105" height="34" rx="6" fill="#1e2235" stroke="#374151" stroke-width="1"/>
    <path d="M1102 33 L1102 27 L1112 27 L1112 33 Z" stroke="#a78bfa" stroke-width="1.6" fill="none"/>
    <text x="1120" y="37" fill="#f1f5f9" font-size="12" font-weight="600">Testar</text>

    <rect x="1204" y="15" width="90" height="34" rx="6" fill="url(#primary-btn)" filter="url(#glow-primary)"/>
    <text x="1232" y="37" fill="#ffffff" font-size="13" font-weight="600">Salvar</text>
  </g>

  <!-- Tabs Navigation Header -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="1240" height="48" rx="8" fill="#11131e" stroke="#1f2334" stroke-width="1"/>
    
    <!-- Tab 1: Geral (ACTIVE) -->
    <rect x="10" y="6" width="110" height="36" rx="6" fill="#1e2237" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="28" cy="24" r="4" fill="#6366f1"/>
    <text x="40" y="29" fill="#ffffff" font-size="13" font-weight="600">Geral</text>
    
    <!-- Tab 2: Personalidade & IA -->
    <text x="160" y="30" fill="#94a3b8" font-size="13" font-weight="500">Personalidade &amp; IA</text>
    <text x="345" y="30" fill="#94a3b8" font-size="13" font-weight="500">Canais</text>
    <text x="450" y="30" fill="#94a3b8" font-size="13" font-weight="500">Ferramentas</text>
    <text x="600" y="30" fill="#94a3b8" font-size="13" font-weight="500">Conhecimento</text>
  </g>

  <!-- Tab Geral Content -->
  <g transform="translate(320, 150)">
    <!-- CARD 1: IDENTIFICAÇÃO E STATUS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="1240" height="150" rx="10" fill="url(#card-grad)" stroke="#22283a" stroke-width="1.5" filter="url(#shadow-card)"/>
      <path d="M 0 10 Q 0 0 10 0 L 1230 0 Q 1240 0 1240 10 L 1240 45 L 0 45 Z" fill="#151824"/>
      <line x1="0" y1="45" x2="1240" y2="45" stroke="#22283a" stroke-width="1"/>
      <text x="25" y="28" fill="#f8fafc" font-size="14" font-weight="600">Identificação &amp; Estado</text>

      <g transform="translate(25, 65)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">NOME DO AGENTE</text>
        <rect x="0" y="10" width="700" height="42" rx="6" fill="#0d0f17" stroke="#2a3045" stroke-width="1"/>
        <text x="16" y="36" fill="#ffffff" font-size="14" font-weight="500">ProH-TI</text>

        <!-- Toggle Switch Card Ativado -->
        <g transform="translate(740, 0)">
          <rect x="0" y="0" width="450" height="52" rx="6" fill="#111420" stroke="#262d42" stroke-width="1"/>
          <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Agente Ativo</text>
          <text x="16" y="42" fill="#64748b" font-size="11">Habilita interações nos canais e no sandbox.</text>
          <rect x="385" y="15" width="44" height="22" rx="11" fill="#7c3aed"/>
          <circle cx="418" cy="26" r="8" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- CARD 2: MODELO LLM E VOZ -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="1240" height="190" rx="10" fill="url(#card-grad)" stroke="#22283a" stroke-width="1.5" filter="url(#shadow-card)"/>
      <path d="M 0 10 Q 0 0 10 0 L 1230 0 Q 1240 0 1240 10 L 1240 45 L 0 45 Z" fill="#151824"/>
      <line x1="0" y1="45" x2="1240" y2="45" stroke="#22283a" stroke-width="1"/>
      <text x="25" y="28" fill="#f8fafc" font-size="14" font-weight="600">Inteligência Artificial (Modelo LLM)</text>

      <g transform="translate(25, 65)">
        <div style="display:flex;">
          <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">MODELO CONFIGURADO</text>
          <text x="960" y="0" fill="#94a3b8" font-size="11">☑ Exigir suporte a áudio/voz</text>
        </div>
        
        <!-- Model Picker Box -->
        <rect x="0" y="10" width="1190" height="42" rx="6" fill="#0d0f17" stroke="#2a3045" stroke-width="1"/>
        <circle cx="24" cy="31" r="5" fill="#38bdf8"/>
        <text x="38" y="36" fill="#f8fafc" font-size="13" font-weight="500">google-antigravity / gemini-3.7-flash-low</text>
        <rect x="1075" y="16" width="100" height="30" rx="4" fill="#1e2436" stroke="#333b52"/>
        <text x="1092" y="35" fill="#cbd5e1" font-size="12">Trocar ▾</text>

        <!-- Command Triggers -->
        <g transform="translate(0, 65)">
          <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">PREFIXOS DE COMANDO (CANAIS COMPARTILHADOS)</text>
          <text x="0" y="16" fill="#64748b" font-size="11">Símbolos para acionar o bot quando em grupos compartilhados (ex: ! #)</text>
          <rect x="0" y="24" width="1190" height="38" rx="6" fill="#0d0f17" stroke="#2a3045" stroke-width="1"/>
          <text x="16" y="48" fill="#f8fafc" font-size="13" font-family="monospace">! #proh</text>
        </g>
      </g>
    </g>

    <!-- CARD 3: GUARDRAILS E SEGURANÇA -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="1240" height="150" rx="10" fill="url(#card-grad)" stroke="#22283a" stroke-width="1.5" filter="url(#shadow-card)"/>
      <path d="M 0 10 Q 0 0 10 0 L 1230 0 Q 1240 0 1240 10 L 1240 45 L 0 45 Z" fill="#151824"/>
      <line x1="0" y1="45" x2="1240" y2="45" stroke="#22283a" stroke-width="1"/>
      <text x="25" y="28" fill="#f8fafc" font-size="14" font-weight="600">Guardrails &amp; Segurança</text>

      <g transform="translate(25, 65)">
        <rect x="0" y="0" width="560" height="56" rx="6" fill="#111420" stroke="#262d42" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-size="13" font-weight="600">Ativar Proteção Contra Injeção</text>
        <text x="16" y="42" fill="#64748b" font-size="11">Previne que mensagens manipulem as regras do agente.</text>
        <rect x="495" y="17" width="44" height="22" rx="11" fill="#7c3aed"/>
        <circle cx="528" cy="28" r="8" fill="#ffffff"/>

        <g transform="translate(600, 0)">
          <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600">NÍVEL DE RIGOR</text>
          <rect x="0" y="10" width="590" height="42" rx="6" fill="#0d0f17" stroke="#2a3045" stroke-width="1"/>
          <text x="16" y="36" fill="#f8fafc" font-size="13">Básico (Hardened Prompt + Log)</text>
          <path d="M565 33 L572 39 L579 33" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
        </g>
      </g>
    </g>
  </g>
</svg>
