<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AllTomatos - Galeria de Logotipos Vetoriais (SVG Transparente)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    header {
      text-align: center;
      max-width: 700px;
    }
    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-muted);
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card h2 {
      font-size: 17px;
      color: #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      font-weight: 600;
    }
    .preview-box {
      width: 100%;
      min-height: 220px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    /* Padrão quadriculado para demonstrar transparência */
    .checkerboard {
      background-color: #1e293b;
      background-image: 
        linear-gradient(45deg, #0f172a 25%, transparent 25%), 
        linear-gradient(-45deg, #0f172a 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #0f172a 75%), 
        linear-gradient(-45deg, transparent 75%, #0f172a 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .light-bg {
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .dark-bg {
      background: #000000;
      border: 1px solid #27272a;
    }
    .preview-box img {
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }
    .icon-box img {
      width: 160px;
      height: 160px;
    }
    .horizontal-box img {
      width: 100%;
      max-height: 110px;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn {
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <h1>AllTomatos — Ativos Oficiais</h1>
    <p>Arquivos vetoriais SVG de alta fidelidade com transparência nativa (Alpha Channel), sem fundos opacos.</p>
  </header>

  <div class="grid">
    <!-- Card 1: Ícone no Quadriculado (Transparência) -->
    <div class="card">
      <h2>Símbolo / Ícone <span class="badge">Transparente</span></h2>
      <div class="preview-box checkerboard icon-box">
        <img src="logo-icon.svg" alt="Ícone AllTomatos Transparente">
      </div>
      <div class="actions">
        <a href="logo-icon.svg" download class="btn">Baixar logo-icon.svg</a>
      </div>
    </div>

    <!-- Card 2: Ícone em Fundo Claro -->
    <div class="card">
      <h2>Símbolo / Ícone <span class="badge" style="background:#e2e8f0;color:#334155;">Fundo Claro</span></h2>
      <div class="preview-box light-bg icon-box">
        <img src="logo-icon.svg" alt="Ícone AllTomatos em Fundo Claro">
      </div>
      <div class="actions">
        <a href="logo-icon.svg" target="_blank" class="btn">Abrir SVG</a>
      </div>
    </div>

    <!-- Card 3: Horizontal no Quadriculado (Transparência) -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>Logotipo Horizontal <span class="badge">Transparente</span></h2>
      <div class="preview-box checkerboard horizontal-box">
        <img src="logo-horizontal.svg" alt="Logotipo Horizontal Transparente">
      </div>
      <div class="actions">
        <a href="logo-horizontal.svg" download class="btn">Baixar logo-horizontal.svg</a>
      </div>
    </div>
  </div>
</body>
</html>
