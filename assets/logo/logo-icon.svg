<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Logotipo AllTomatos: Tomate vermelho com símbolos de código">
  <title>AllTomatos Logo</title>
  <desc>Tomate vermelho volumétrico estilizado com folhas verdes e o símbolo de código &lt; / &gt; em branco no centro, com fundo transparente.</desc>
  <defs>
    <!-- Gradiente do Corpo do Tomate (Iluminação volumétrica a 10h) -->
    <radialGradient id="tomatoBodyGrad" cx="36%" cy="30%" r="70%" fx="28%" fy="24%">
      <stop offset="0%" stop-color="#FF5D62" />
      <stop offset="25%" stop-color="#F03339" />
      <stop offset="68%" stop-color="#D41B22" />
      <stop offset="92%" stop-color="#A51017" />
      <stop offset="100%" stop-color="#840C12" />
    </radialGradient>

    <!-- Gradiente de Oclusão e Sombra Inferior do Tomate -->
    <linearGradient id="tomatoShadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E080F" stop-opacity="0" />
      <stop offset="50%" stop-color="#6E080F" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#55050A" stop-opacity="0.6" />
    </linearGradient>

    <!-- Gradiente da Folha Grande Superior (Direita) -->
    <linearGradient id="mainLeafGrad" x1="15%" y1="85%" x2="80%" y2="15%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="50%" stop-color="#4CAF50" />
      <stop offset="85%" stop-color="#7CB342" />
      <stop offset="100%" stop-color="#8BC34A" />
    </linearGradient>

    <!-- Gradiente da Folha Esquerda -->
    <linearGradient id="leftLeafGrad" x1="85%" y1="85%" x2="20%" y2="15%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="50%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#689F38" />
    </linearGradient>

    <!-- Gradiente do Caule -->
    <linearGradient id="stemGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="60%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#7CB342" />
    </linearGradient>

    <!-- Gradiente das Sépalas do Cálice -->
    <linearGradient id="calyxGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#558B2F" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Sombra Suave dos Símbolos de Código -->
    <filter id="codeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#4E080C" flood-opacity="0.45" />
    </filter>

    <!-- Sombra Projetada do Cálice sobre o Tomate -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#400407" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ==================== 1. CORPO DO TOMATE ==================== -->
  <g id="tomato-fruit">
    <!-- Contorno e Preenchimento Principal -->
    <path d="M 260,110
             C 358,110 442,185 446,285
             C 450,388 368,460 260,460
             C 152,460 74,388 74,285
             C 74,185 162,110 260,110 Z"
          fill="url(#tomatoBodyGrad)"
          stroke="#7A1118"
          stroke-width="13"
          stroke-linejoin="round" />

    <!-- Sombra Inferior (Volume 3D) -->
    <path d="M 80,300
             C 80,392 160,455 260,455
             C 360,455 440,392 440,300
             C 420,385 348,435 260,435
             C 172,435 100,385 80,300 Z"
          fill="url(#tomatoShadowGrad)" />

    <!-- Borda Clara Superior (Reflexo abaixo das folhas) -->
    <path d="M 205,124
             C 228,118 260,116 295,120
             C 325,124 350,132 370,144"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="7"
          stroke-linecap="round"
          opacity="0.65" />

    <!-- Destaque Especular Primário (Formato Feijão no Ombro Esquerdo) -->
    <path d="M 174,158
             C 192,170 200,192 192,208
             C 188,214 180,215 174,209
             C 168,202 170,188 158,180
             C 150,174 142,172 142,166
             C 142,160 156,150 174,158 Z"
          fill="#FFFFFF"
          opacity="0.45" />

    <!-- Destaque Especular Secundário (Ponto redondo) -->
    <circle cx="146" cy="228" r="9" fill="#FFFFFF" opacity="0.45" />
  </g>

  <!-- ==================== 2. CÁLICE, FOLHAS E CAULE ==================== -->
  <g id="calyx-and-leaves" filter="url(#leafShadow)">
    <!-- Folha Esquerda -->
    <g id="leaf-left">
      <path d="M 270,122
               C 240,116 205,98 190,105
               C 182,109 184,118 195,122
               C 220,132 250,132 272,130 Z"
            fill="url(#leftLeafGrad)"
            stroke="#1D3F12"
            stroke-width="6.5"
            stroke-linejoin="round" />
      <!-- Realce superior claro da folha esquerda -->
      <path d="M 194,107 C 220,105 248,114 266,122"
            fill="none"
            stroke="#9EE855"
            stroke-width="3"
            stroke-linecap="round" />
    </g>

    <!-- Sépala Menor Esquerda -->
    <path d="M 235,128
             C 215,134 200,146 202,152
             C 204,156 216,154 228,146
             C 240,138 252,134 258,130 Z"
          fill="url(#calyxGrad)"
          stroke="#1D3F12"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Caule Central -->
    <g id="stem">
      <path d="M 276,126
               C 272,98 276,70 292,52
               C 298,44 310,46 312,56
               C 314,68 306,94 300,120
               C 298,126 294,132 290,136 Z"
            fill="url(#stemGrad)"
            stroke="#1D3F12"
            stroke-width="6.5"
            stroke-linejoin="round" />
      <!-- Brilho lateral do caule -->
      <path d="M 284,115 C 282,90 286,68 296,55"
            fill="none"
            stroke="#A3ED58"
            stroke-width="2.5"
            stroke-linecap="round" />
    </g>

    <!-- Folha Grande Principal (Direita) -->
    <g id="leaf-main-right">
      <path d="M 292,125
               C 305,95 328,58 368,36
               C 388,24 412,32 414,54
               C 416,80 392,118 355,138
               C 332,150 306,142 292,125 Z"
            fill="url(#mainLeafGrad)"
            stroke="#1D3F12"
            stroke-width="7.5"
            stroke-linejoin="round" />

      <!-- Nervura Central -->
      <path d="M 306,128 C 334,106 364,78 396,46"
            fill="none"
            stroke="#1B4D12"
            stroke-width="4.5"
            stroke-linecap="round" />

      <!-- Borda de Realce Superior Claro -->
      <path d="M 336,60 C 362,40 388,32 404,38 C 410,42 412,50 410,60"
            fill="none"
            stroke="#B6F365"
            stroke-width="4"
            stroke-linecap="round" />
    </g>

    <!-- Sépala Menor Direita -->
    <path d="M 296,134
             C 318,144 340,146 348,140
             C 352,136 342,130 330,128
             C 316,126 304,128 296,134 Z"
          fill="url(#calyxGrad)"
          stroke="#1D3F12"
          stroke-width="5.5"
          stroke-linejoin="round" />
  </g>

  <!-- ==================== 3. SÍMBOLOS DE CÓDIGO < / > ==================== -->
  <g id="code-glyphs" fill="#FFFFFF" filter="url(#codeShadow)">
    <!-- Bracket Esquerdo < -->
    <path d="M 235,232 
             L 155,292 
             L 235,352 
             L 235,322 
             L 195,292 
             L 235,262 Z" />

    <!-- Barra Inclinada / -->
    <path d="M 308,212 
             L 338,212 
             L 260,372 
             L 230,372 Z" />

    <!-- Bracket Direito > -->
    <path d="M 341,232 
             L 421,292 
             L 341,352 
             L 341,322 
             L 381,292 
             L 341,262 Z" />
  </g>
</svg>
